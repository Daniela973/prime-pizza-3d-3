<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrimePizza — Pizza Artesanal</title>

<meta name="description" content="PrimePizza — pizza artesanal feita para você.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

/* =========================
   HEADER
========================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:75px;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(8,8,8,.72);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:#ff5a16;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#ddd;
    font-size:14px;
    transition:.3s;
}

nav a:hover{
    color:#ff5a16;
}

.cart-button{
    border:1px solid rgba(255,255,255,.2);
    background:#151515;
    color:#fff;
    padding:10px 17px;
    border-radius:30px;
    cursor:pointer;
    transition:.3s;
}

.cart-button:hover{
    background:#ff5a16;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    overflow:hidden;
    padding:100px 7% 60px;
}

.hero::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    right:-200px;
    top:100px;
    background:radial-gradient(
        circle,
        rgba(255,74,10,.22),
        transparent 68%
    );
    pointer-events:none;
}

.hero-content{
    width:50%;
    position:relative;
    z-index:5;
}

.eyebrow{
    color:#ff641f;
    font-size:13px;
    font-weight:bold;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(50px,7vw,100px);
    line-height:.9;
    letter-spacing:-5px;
    margin-bottom:28px;
}

.hero h1 span{
    color:#ff5a16;
}

.hero p{
    max-width:500px;
    color:#aaa;
    font-size:18px;
    line-height:1.6;
    margin-bottom:35px;
}

.primary-button{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:#ff5a16;
    color:#fff;
    border:none;
    padding:16px 25px;
    border-radius:40px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 15px 40px rgba(255,90,22,.2);
}

.primary-button:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 50px rgba(255,90,22,.35);
}

/* =========================
   3D CONTAINER
========================= */

#pizza-container{
    position:absolute;
    right:0;
    top:75px;
    width:58%;
    height:calc(100vh - 75px);
    z-index:2;
}

#pizza-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================
   FALLBACK PIZZA
========================= */

.fallback-pizza{
    position:absolute;
    left:50%;
    top:50%;
    width:min(390px,65vw);
    aspect-ratio:1;
    transform:translate(-50%,-50%) rotate(-8deg);
    border-radius:50%;
    background:
        radial-gradient(
            circle at 30% 30%,
            #fff3d1 0 3%,
            transparent 4%
        ),
        radial-gradient(
            circle at 68% 35%,
            #ffbc25 0 4%,
            transparent 5%
        ),
        radial-gradient(
            circle at 40% 70%,
            #ff3424 0 5%,
            transparent 6%
        ),
        radial-gradient(
            circle at 70% 70%,
            #e52820 0 5%,
            transparent 6%
        ),
        radial-gradient(
            circle at 52% 48%,
            #ef2d20 0 5%,
            transparent 6%
        ),
        radial-gradient(
            circle,
            #f6c15a 0 72%,
            #d56a22 73% 78%,
            #8e3b13 79% 100%
        );
    box-shadow:
        0 35px 80px rgba(0,0,0,.55),
        0 0 80px rgba(255,70,10,.16);
}

.fallback-pizza::after{
    content:"";
    position:absolute;
    inset:10%;
    border-radius:50%;
    border:10px solid rgba(255,255,255,.08);
}

.pizza-smoke{
    position:absolute;
    left:50%;
    top:28%;
    width:20px;
    height:20px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    filter:blur(8px);
    animation:smoke 3s infinite ease-out;
}

.pizza-smoke:nth-child(2){
    left:44%;
    animation-delay:1s;
}

.pizza-smoke:nth-child(3){
    left:58%;
    animation-delay:1.7s;
}

@keyframes smoke{
    0%{
        transform:translateY(30px) scale(.6);
        opacity:0;
    }
    30%{
        opacity:.5;
    }
    100%{
        transform:translateY(-120px) scale(2);
        opacity:0;
    }
}

/* =========================
   STORY
========================= */

.story{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:120px 7%;
    background:#0c0c0c;
}

.story-inner{
    max-width:950px;
    text-align:center;
}

.story h2{
    font-size:clamp(40px,6vw,75px);
    line-height:.95;
    letter-spacing:-3px;
    margin-bottom:30px;
}

.story h2 span{
    color:#ff5a16;
}

.story p{
    color:#999;
    font-size:18px;
    line-height:1.8;
    max-width:720px;
    margin:auto;
}

/* =========================
   MENU
========================= */

.menu{
    padding:120px 7%;
    background:#080808;
}

.section-top{
    display:flex;
    align-items:end;
    justify-content:space-between;
    margin-bottom:55px;
}

.section-top h2{
    font-size:clamp(40px,5vw,70px);
    letter-spacing:-3px;
}

.section-top p{
    color:#777;
    max-width:350px;
    line-height:1.6;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.menu-card{
    background:#111;
    border:1px solid rgba(255,255,255,.07);
    border-radius:24px;
    padding:18px;
    transition:.35s;
}

.menu-card:hover{
    transform:translateY(-8px);
    border-color:rgba(255,90,22,.5);
}

.food-image{
    height:220px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255,90,22,.18),
            transparent 65%
        );
}

.mini-pizza{
    width:155px;
    height:155px;
    border-radius:50%;
    background:
        radial-gradient(circle at 25% 30%,#e52a20 0 5%,transparent 6%),
        radial-gradient(circle at 70% 35%,#e52a20 0 5%,transparent 6%),
        radial-gradient(circle at 45% 65%,#e52a20 0 5%,transparent 6%),
        radial-gradient(circle,#f4bd51 0 72%,#d66d22 73% 80%,#813612 81%);
    box
